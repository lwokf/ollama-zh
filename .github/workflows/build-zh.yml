# Ollama 汉化补丁自动构建流水线
#
# 触发方式:
#   1. workflow_dispatch(手动):填上游版本号(如 v0.32.5),或留空自动检测最新 Release
#   2. schedule:每天 04:00 自动检测上游是否有新版本,有则自动构建发布
#
# 流程: 检测版本 -> 克隆上游对应 tag -> 应用汉化补丁(translations/zh-CN.patch)
#        -> 构建前端(npm) -> 编译桌面端(go + mingw) -> 打包 zip -> 发布 Release

name: Build Ollama Hanhua

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Ollama 上游版本号(如 v0.32.5),留空则自动检测最新版"
        required: false
        default: ""
  schedule:
    - cron: "0 4 * * *"
  push:
    branches: [master]

permissions:
  contents: write

concurrency:
  group: build-zh
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 确定目标版本
        id: version
        shell: bash
        run: |
          set -euo pipefail
          V="${{ github.event.inputs.version }}"
          if [ -z "$V" ]; then
            V=$(curl -sS https://api.github.com/repos/ollama/ollama/releases/latest \
              | python -c "import sys,json;print(json.load(sys.stdin)['tag_name'])")
          fi
          V="${V#v}"
          V="v${V}"
          echo "VERSION=${V}" >> "$GITHUB_OUTPUT"
          echo "target version: ${V}"

      # 定时触发时若已构建过该版本则跳过;手动触发始终重新构建(会覆盖旧 Release)
      - name: 检查是否已构建过该版本(仅定时触发时跳过)
        id: check-existing
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "SKIP=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TAG="zh-${{ steps.version.outputs.VERSION }}"
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "release ${TAG} already exists, skipping"
            echo "SKIP=true" >> "$GITHUB_OUTPUT"
          else
            echo "SKIP=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 克隆上游源码(带重试)
        if: steps.check-existing.outputs.SKIP != 'true'
        shell: bash
        run: |
          # GitHub 克隆偶发网络失败,重试 3 次
          for i in 1 2 3; do
            git clone --depth 1 --branch ${{ steps.version.outputs.VERSION }} \
              https://github.com/ollama/ollama.git upstream && break
            echo "clone attempt $i failed, retrying in 10s..."
            rm -rf upstream
            sleep 10
          done
          test -d upstream/.git

      - name: 应用汉化补丁
        if: steps.check-existing.outputs.SKIP != 'true'
        shell: bash
        run: |
          # 剔除可能的 CR 行尾(防止 Windows 检出把补丁转成 CRLF 导致无法匹配 LF 源码)
          tr -d '\r' < translations/zh-CN.patch > translations/zh-CN.lf.patch
          git -C upstream apply --check ../translations/zh-CN.lf.patch
          git -C upstream apply ../translations/zh-CN.lf.patch
          rm -f translations/zh-CN.lf.patch
          echo "patch applied"

      - name: 安装 Node.js
        if: steps.check-existing.outputs.SKIP != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 构建前端(go:embed 需要 dist)
        if: steps.check-existing.outputs.SKIP != 'true'
        shell: bash
        run: |
          cd upstream/app/ui/app
          npm ci --no-audit --no-fund
          npm run build

      - name: 安装 Go
        if: steps.check-existing.outputs.SKIP != 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: upstream/go.mod

      - name: 安装 MinGW(CGO 编译 webview)
        if: steps.check-existing.outputs.SKIP != 'true'
        shell: bash
        run: |
          choco install mingw -y --no-progress
          gcc --version | head -1
          g++ --version | head -1

      - name: 编译汉化版 ollama app.exe
        if: steps.check-existing.outputs.SKIP != 'true'
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/c/ProgramData/chocolatey/bin:$PATH"
          cd upstream
          CGO_ENABLED=1 go build -trimpath \
            -ldflags "-s -w -H windowsgui -X=github.com/ollama/ollama/app/version.Version=${{ steps.version.outputs.VERSION }}" \
            -o ../ollama-app-zh.exe ./app/cmd/app/
          ls -lh ../ollama-app-zh.exe

      - name: 打包补丁 zip
        if: steps.check-existing.outputs.SKIP != 'true'
        shell: pwsh
        run: |
          $ver = "${{ steps.version.outputs.VERSION }}"
          $dir = "ollama-zh-$ver"
          New-Item -ItemType Directory -Path $dir | Out-Null
          Copy-Item ollama-app-zh.exe "$dir\ollama app.exe"
          Copy-Item scripts\apply-patch.ps1 $dir\
          Copy-Item scripts\apply-patch.cmd $dir\
          Copy-Item scripts\restore-official.cmd $dir\
          Copy-Item README.md "$dir\README-使用说明.md" -ErrorAction SilentlyContinue
          Compress-Archive -Path $dir -DestinationPath "$dir-win64.zip" -Force
          Get-ChildItem "ollama-zh-*.zip" | Select-Object Name, Length

      - name: 上传构建产物(Artifact)
        if: steps.check-existing.outputs.SKIP != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ollama-zh-${{ steps.version.outputs.VERSION }}
          path: ollama-zh-*.zip
          retention-days: 30

      - name: 发布 Release
        if: steps.check-existing.outputs.SKIP != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: zh-${{ steps.version.outputs.VERSION }}
          name: Ollama 汉化补丁 ${{ steps.version.outputs.VERSION }}
          body: |
            ## Ollama 汉化补丁 ${{ steps.version.outputs.VERSION }}

            ### 本次更新
            - 词典驱动的自动翻译,覆盖 UI 文本、错误提示、菜单项等
            - 错误边界中文组件(替换 @tanstack/react-router 默认英文错误组件)
            - 设置页、聊天页、模型选择器等完整汉化
            - 以上内容由词典 + 补丁自动生成,可复现、可审查

            ### 最简单的用法(推荐,双击即可)
            1. 退出正在运行的 Ollama(托盘图标右键 → 退出 Ollama)
            2. 解压本 zip,**双击 `apply-patch.cmd`**
            3. 弹窗(UAC)点"是",等待提示完成
            4. 重新启动 Ollama,界面即为中文

            ### 高级用法(可选)
            解压目录内右键"以管理员身份运行 PowerShell",执行:
            ```powershell
            .\apply-patch.ps1
            ```
            还原官方原版:双击 `restore-official.cmd`(或运行 `apply-patch.ps1 -Restore`)

            ### 解压位置:任意目录都可以
            补丁包可以解压到任意目录(桌面/下载/任意文件夹),**不需要**放进 Ollama 安装目录。
            脚本会自动查找安装位置(依次检测 `D:\ollama`、`%LOCALAPPDATA%\Programs\Ollama`、`C:\Program Files\Ollama`),
            也可手动指定:`.\apply-patch.ps1 -InstallDir "D:\你的路径"`。

            唯一要求:**`apply-patch.cmd`/`apply-patch.ps1` 与 `ollama app.exe` 必须保持在同一个文件夹内**。

            ### 升级后如何恢复中文
            官方更新(自动更新或重装)会覆盖汉化版 exe,更新完成后**重新运行一次 apply-patch.ps1 即可**。

            ### 还原官方原版
            ```powershell
            .\apply-patch.ps1 -Restore
            ```

            ### 说明
            - 仅替换 `ollama app.exe`(桌面端 UI),服务端 `ollama.exe` 保持官方原版
            - 首次应用自动备份官方 exe(`ollama app.exe.official.bak`)
            - 汉化来源:本仓库 `translations/zh-CN.patch`(可复现、可审查)
          files: ollama-zh-*.zip
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
